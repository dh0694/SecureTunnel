# HA lab: TLS passes straight through to the control servers (TCP mode).
# control-a is active; control-b takes over when control-a fails two health
# checks (about 4 seconds), and hands back when control-a is healthy again.
global
    log stdout format raw local0 info

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout client 120s   # the agent's watch long-poll holds requests ~25 s
    timeout server 120s
    retries 3
    option redispatch     # a refused connection retries on the other control server

frontend control
    bind :8443
    default_backend controls

backend controls
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 check check-ssl verify none resolvers docker init-addr last,libc,none
    server control-a control:8443
    server control-b control-b:8443 backup

# Stats on the internal Docker network only (not published on the host). The
# control servers read them for the admin site's System page.
frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /stats
