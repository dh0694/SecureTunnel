<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1230" viewBox="0 0 680 615" font-family="Segoe UI, system-ui, sans-serif">
<title>SecureTunnel HA lab topology</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="615" fill="#ffffff"/>
<g font-size="14" text-anchor="middle" dominant-baseline="central">

<rect x="40" y="40" width="170" height="56" rx="8" fill="#f6f7f9" stroke="#98a2b3" stroke-width="0.75"/>
