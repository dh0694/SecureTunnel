<path d="M60 96 L60 498 L108 498" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M60 498 L60 545 L355 545 L355 528" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>

<rect x="80" y="578" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
