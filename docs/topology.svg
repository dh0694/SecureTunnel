<text x="100" y="170" text-anchor="start" font-size="12" fill="#475467">172.234.204.252</text>
<line x1="340" y1="96" x2="340" y2="168" stroke="#667085" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="260" y="170" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
