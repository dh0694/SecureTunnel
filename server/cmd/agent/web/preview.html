<!doctype html>
<!-- Design preview of the agent window with fake data. Not shipped: the app
     embeds index.html, app.css and app.js only. Open via the "agent-ui-demo"
     launch config and add ?state=connected|reconnecting|signin|office|setup. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>SecureTunnel (preview)</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #8a93a3; overflow: auto; }
  @media (prefers-color-scheme: dark) { body { background: #05070a; } }
  .frame { width: 420px; height: 700px; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); position: relative; }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="frame"><iframe id="win" title="SecureTunnel window"></iframe></div>
<script src="mock.js"></script>
</body>
</html>
